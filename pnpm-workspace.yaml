packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@reown/appkit": true
  bufferutil: true
  keccak: true
  unrs-resolver: true
  utf-8-validate: true

catalog:
  "@eslint/js": 9.39.5
  "@types/node": 26.5.1
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  eslint: 9.39.5
  pg: 8.23.0
  pg-mem: 3.0.14
  prettier: 3.9.6
  typescript: 6.0.3
  typescript-eslint: 8.70.0
  viem: 2.56.5
  vitest: 5.0.1

minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.1"
  - "@vitest/spy@5.0.1"
  - vitest@5.0.1

patchedDependencies:
  "@privy-io/react-auth": patches/@privy-io__react-auth.patch

overrides:
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
  brace-expansion: ">=1.1.21"
  decode-uri-component: ">=0.4.3"
